apply plugin: 'com.android.application'

android {
    namespace 'info.fadl.mamalauncher'
    compileSdk 33
    defaultConfig {
        applicationId "info.fadl.mamalauncher"
        minSdk 24
        targetSdk 33
        versionCode 16
        versionName "0.14-pilot-candidate"
    }
    flavorDimensions "notificationAccess"
    productFlavors {
        full {
            dimension "notificationAccess"
            buildConfigField "boolean", "NOTIFICATION_ACCESS", "true"
        }
        noNotif {
            dimension "notificationAccess"
            versionCode 21
            versionName "0.16-no-notif-candidate"
            buildConfigField "boolean", "NOTIFICATION_ACCESS", "false"
        }
    }
    buildTypes {
        release {
            // Unsigned by default: the owner signs release artifacts out-of-band
            // with the dedicated release key (docs/build-and-test.md).
        }
        // T-04a measurement build: release-like (minify/settings of release via
        // initWith) but signed with the LOCAL debug key so a profileable APK can
        // run on an emulator/test device. Never signed with the release key and
        // never distributed; mixing build types invalidates before/after numbers.
        profileable {
            initWith release
            signingConfig signingConfigs.debug
            // The :ui library only ships debug/release; consume its release variant.
            matchingFallbacks = ['release']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions {
        // Robolectric flow tests need the merged manifest + resources.
        unitTests { includeAndroidResources = true }
    }
}

dependencies {
    implementation project(':ui')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
}
