name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Runner baseline (T-02): JDK 11 (Temurin), Android SDK platform 33,
# Build Tools 30.0.3, ubuntu-22.04 pinned image. Robolectric and lint run
# as SEPARATE jobs: a combined run hit exit 137 on a 2GB runner. Debug
# packaging runs only after every check passes and is never uploaded.

jobs:
  wrapper:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Gradle wrapper jars
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          validate-wrappers: true

  unit-tests:
    needs: wrapper
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Android SDK platform 33 + Build Tools 30.0.3
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-33" "build-tools;30.0.3"
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - run: ./gradlew :app:testNoNotifDebugUnitTest :app:testFullDebugUnitTest

  goldens:
    needs: wrapper
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - run: ./gradlew :ui:verifyPaparazziDebug

  lint:
    needs: wrapper
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Android SDK platform 33 + Build Tools 30.0.3
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-33" "build-tools;30.0.3"
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - run: ./gradlew :app:lintNoNotifDebug :app:lintFullDebug :ui:lintDebug

  manifest-check:
    needs: wrapper
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Android SDK platform 33 + Build Tools 30.0.3
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-33" "build-tools;30.0.3"
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Merge both flavor manifests
        run: ./gradlew :app:processNoNotifDebugMainManifest :app:processFullDebugMainManifest
      - name: noNotif artifact inputs carry no notification listener
        run: |
          if grep -q 'LauncherNotificationListener' app/build/intermediates/merged_manifest/noNotifDebug/AndroidManifest.xml; then
            echo 'FAIL: notification listener present in merged noNotif manifest' >&2; exit 1
          fi
          grep -q 'LauncherNotificationListener' app/build/intermediates/merged_manifest/fullDebug/AndroidManifest.xml \
            || { echo 'FAIL: positive control - listener missing from merged full manifest' >&2; exit 1; }
          echo 'OK: listener absent from noNotif inputs, present in full inputs'

  package:
    needs: [unit-tests, goldens, lint, manifest-check]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Android SDK platform 33 + Build Tools 30.0.3
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-33" "build-tools;30.0.3"
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: CI-only debug packaging (never uploaded, never distributed)
        run: ./gradlew :app:assembleNoNotifDebug :app:assembleFullDebug
